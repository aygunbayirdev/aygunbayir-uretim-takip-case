services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - sqlite_data:/app/data
    environment:
      DATABASE_URL: sqlite:///./data/production.db
      API_ENDPOINT: http://89.252.189.91:8983/api/v1/submit
      API_KEY: ""
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    environment:
      BACKEND_HOST: backend
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlite_data:
